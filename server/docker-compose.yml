# Postgres cho môi trường dev. Cổng 5435 để không đụng các project khác trong workspace (5433/5434).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market
    ports:
      - '5435:5432'
    volumes:
      - market-pg:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U market -d market']
      interval: 2s
      timeout: 3s
      retries: 20

  # Hộp thư giả cho dev: nhận mọi email server gửi qua SMTP (cổng 1025), xem tại http://localhost:8025.
  # Không gửi ra ngoài. Bật bằng `npm run mail:up`, đặt SMTP_URL=smtp://localhost:1025 trong .env.
  mailpit:
    image: axllent/mailpit:v1.20.0
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  market-pg:
